name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ["3.4.0", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - name: Generated code is up to date
        run: |
          node tool/gen/gen.js tool/gen/openapi.json lib/src
          dart format lib
          git diff --exit-code
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Compiles for the web
        run: dart compile js -o /tmp/example.js test/web_compile_check.dart
